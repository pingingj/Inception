services:
  nginx:
    container_name: nginx
    env_file:
      - .env
    restart: on-failure
    ports:
        - "443:443"
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    networks:
      - incepternet
  mariadb:
    env_file:
      - .env
    container_name: mariadb
    secrets:
      - path_userdb
      - path_rootdb
    restart: on-failure
    expose:
      - 3306
    volumes:
        - v_mariadb:/var/lib/mysql
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    networks:
      - incepternet
  wordpress:
    container_name: wordpress
    env_file:
      - .env
    restart: on-failure
    expose:
      - 9000
    volumes:
        - v_wordpress:/var/www/html
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    networks:
      - incepternet

networks:
  incepternet:
    driver: bridge

volumes:
  v_mariadb:
    name: v_mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  v_wordpress:
    name: v_wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress
  
secrets:
  path_userdb:
    file: ../secrets/mariadbuser.txt
  path_rootdb:
    file: ../secrets/mariarute.txt